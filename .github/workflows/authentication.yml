name: Backend, authentication, intake, analysis and simulation pricing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, DaemionBladee-dev, 'codex/**']

permissions:
  contents: read

jobs:
  postgres-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_USER: 3dps_test
          POSTGRES_PASSWORD: ci-disposable-test-only
          POSTGRES_DB: 3dps_test_auth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U 3dps_test -d 3dps_test_auth"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://3dps_test:ci-disposable-test-only@127.0.0.1:5432/3dps_test_auth
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: miniapp/.node-version
      - run: uv sync --frozen
        working-directory: backend
      - name: Build pinned isolated slicer for real security and geometry tests
        run: |
          docker build -f worker/Dockerfile -t 3dps-slicer:m06-ci .
          echo "M06_TEST_WORKER_IMAGE=$(docker image inspect --format '{{.Id}}' 3dps-slicer:m06-ci)" >> "$GITHUB_ENV"
      - run: uv run --frozen ruff check app alembic tests scripts ../telegram_bot ../worker
        working-directory: backend
      - run: uv run --frozen mypy app scripts ../telegram_bot ../worker
        working-directory: backend
      - run: uv run --frozen pytest -q
        working-directory: backend
      - name: Check migration metadata
        run: uv run --frozen alembic check
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: PYTHONPATH=.:.. uv run --frozen python scripts/export_openapi.py
        working-directory: backend
      - run: npm ci
        working-directory: tools/api-types
      - run: npm run generate
        working-directory: tools/api-types
      - run: git diff --exit-code -- backend/openapi.json miniapp/src/lib/api/schema.d.ts
      - name: Create isolated browser-test database
        working-directory: backend
        run: |
          uv run --frozen python - <<'PY'
          import asyncio, asyncpg, os
          async def prepare():
              connection = await asyncpg.connect(os.environ['TEST_DATABASE_URL'].replace('postgresql+asyncpg:', 'postgresql:', 1))
              try:
                  await connection.execute('CREATE DATABASE "3dps_test_browser"')
              finally:
                  await connection.close()
          asyncio.run(prepare())
          PY
      - run: uv run --frozen alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://3dps_test:ci-disposable-test-only@127.0.0.1:5432/3dps_test_browser
      - run: npm ci
        working-directory: miniapp
      - run: npx playwright install --with-deps chromium
        working-directory: miniapp
      - run: npm run test:auth-integration
        working-directory: miniapp
        env:
          TEST_BROWSER_DATABASE_URL: postgresql+asyncpg://3dps_test:ci-disposable-test-only@127.0.0.1:5432/3dps_test_browser

      - name: Build application container
        run: docker build -f backend/Dockerfile -t 3dps-api:m07-ci .
      - name: Prepare isolated container-test database
        working-directory: backend
        run: |
          uv run --frozen python - <<'PY'
          import asyncio, asyncpg, os
          async def prepare():
              connection = await asyncpg.connect(os.environ['TEST_DATABASE_URL'].replace('postgresql+asyncpg:', 'postgresql:', 1))
              try:
                  await connection.execute('CREATE DATABASE "3dps_test_browser_container"')
              finally:
                  await connection.close()
          asyncio.run(prepare())
          PY
      - name: Migrate and start production-mode application container
        run: |
          cat > "$RUNNER_TEMP/m07-container.env" <<'ENV'
          APP_ENV=production
          DATABASE_URL=postgresql+asyncpg://3dps_test:ci-disposable-test-only@host.docker.internal:5432/3dps_test_browser_container
          BOT_TOKEN=m02-integration-synthetic-bot-token
          SESSION_SECRET=m07-container-synthetic-secret-never-use-outside-tests-12345
          OWNER_TELEGRAM_IDS=111
          PUBLIC_BASE_URL=https://127.0.0.1:18443
          SIMULATION_MODE=true
          DEVELOPMENT_AUTH_ENABLED=false
          BINDING_QUOTES_ENABLED=false
          AUTO_QUOTE_ENABLED=false
          PAYMENT_POLICY_APPROVED=false
          LIVE_PAYMENTS_ENABLED=false
          REAL_PRINTING_ENABLED=false
          AUTH_RATE_LIMIT=100
          ENV
          chmod 600 "$RUNNER_TEMP/m07-container.env"
          docker run --rm --add-host=host.docker.internal:host-gateway --env-file "$RUNNER_TEMP/m07-container.env" 3dps-api:m07-ci alembic upgrade head
          docker volume create 3dps-m07-private-ci
          docker run --detach --volume 3dps-m07-private-ci:/srv/private_uploads --name 3dps-m07-container-ci --add-host=host.docker.internal:host-gateway --publish 127.0.0.1:18002:8000 --env-file "$RUNNER_TEMP/m07-container.env" 3dps-api:m07-ci
      - name: Real-stack checks against the application container
        run: node scripts/test-auth-integration.mjs
        working-directory: miniapp
        env:
          TEST_CONTAINER_API: 'true'
          TEST_BROWSER_DATABASE_URL: postgresql+asyncpg://3dps_test:ci-disposable-test-only@127.0.0.1:5432/3dps_test_browser_container
      - name: Verify bounded upload recovery preserves ready model files
        run: docker exec 3dps-m07-container-ci python scripts/cleanup_uploads.py
      - name: Clean up application test container
        if: always()
        run: |
          docker rm --force 3dps-m07-container-ci 2>/dev/null || true
          docker volume rm 3dps-m07-private-ci 2>/dev/null || true
          rm -f "$RUNNER_TEMP/m07-container.env"
