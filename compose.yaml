name: 3dps-development
services:
  db:
    image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    environment:
      POSTGRES_USER: 3dps
      POSTGRES_DB: 3dps_development
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development database password}
    volumes:
      - development_db:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U 3dps -d 3dps_development']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: 'no'
  api:
    image: 3dps-api:development
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &auth_environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://3dps:${POSTGRES_PASSWORD:?Set a development database password}@db:5432/3dps_development
      BOT_TOKEN: ${BOT_TOKEN:?Set a dedicated test bot token}
      SESSION_SECRET: ${SESSION_SECRET:?Set a random development session secret}
      OWNER_TELEGRAM_IDS: ${OWNER_TELEGRAM_IDS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the exact Mini App origin}
      SIMULATION_MODE: 'true'
      BINDING_QUOTES_ENABLED: 'false'
      AUTO_QUOTE_ENABLED: 'false'
      PAYMENT_POLICY_APPROVED: 'false'
      LIVE_PAYMENTS_ENABLED: 'false'
      REAL_PRINTING_ENABLED: 'false'
      DEVELOPMENT_AUTH_ENABLED: 'false'
      # Private mount location is fixed; quotas remain configurable in .env.local.
      STORAGE_ROOT: /srv/private_uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      REQUEST_STORAGE_BYTES: ${REQUEST_STORAGE_BYTES:-104857600}
      USER_STORAGE_BYTES: ${USER_STORAGE_BYTES:-524288000}
      TOTAL_STORAGE_BYTES: ${TOTAL_STORAGE_BYTES:-2147483648}
      REQUEST_FILE_LIMIT: ${REQUEST_FILE_LIMIT:-10}
      USER_FILE_LIMIT: ${USER_FILE_LIMIT:-100}
      TOTAL_FILE_LIMIT: ${TOTAL_FILE_LIMIT:-10000}
      MAX_INFLIGHT_UPLOADS: ${MAX_INFLIGHT_UPLOADS:-2}
      UPLOAD_TIMEOUT_SECONDS: ${UPLOAD_TIMEOUT_SECONDS:-60}
      UPLOAD_LEASE_SECONDS: ${UPLOAD_LEASE_SECONDS:-120}
      INTAKE_RATE_LIMIT: ${INTAKE_RATE_LIMIT:-120}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-10}
      INTAKE_RATE_WINDOW_SECONDS: ${INTAKE_RATE_WINDOW_SECONDS:-60}
      ARCHIVE_ENTRY_LIMIT: ${ARCHIVE_ENTRY_LIMIT:-64}
      ARCHIVE_EXPANDED_BYTES: ${ARCHIVE_EXPANDED_BYTES:-67108864}
      ARCHIVE_ENTRY_BYTES: ${ARCHIVE_ENTRY_BYTES:-16777216}
      ARCHIVE_RATIO_LIMIT: ${ARCHIVE_RATIO_LIMIT:-100}
      VALIDATION_TIMEOUT_SECONDS: ${VALIDATION_TIMEOUT_SECONDS:-15}
      VALIDATION_CPU_SECONDS: ${VALIDATION_CPU_SECONDS:-5}
    volumes: [private_uploads:/srv/private_uploads]
    ports: ['127.0.0.1:8000:8000']
    networks: [database, edge]
    depends_on:
      db: {condition: service_healthy}
    # Apply the reviewed Alembic migration chain explicitly before starting this service.
    restart: 'no'
  bot:
    image: 3dps-api:development
    profiles: [bot]
    environment: *auth_environment
    command: [python, -m, telegram_bot]
    networks: [edge]
    restart: 'no'
networks:
  database: {internal: true}
  edge: {}
volumes:
  development_db: {}
  private_uploads: {}
